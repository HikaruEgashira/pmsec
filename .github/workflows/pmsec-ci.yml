name: pmsec ci
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'node/**'
      - 'python/**'
      - 'bash/**'
      - 'powershell/**'
      - 'conformance/**'
      - '.github/workflows/pmsec-ci.yml'
  pull_request:
    paths:
      - 'node/**'
      - 'python/**'
      - 'bash/**'
      - 'powershell/**'
      - 'conformance/**'
      - '.github/workflows/pmsec-ci.yml'
permissions: {}
jobs:
  node:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [hikae-flash]
        node: [22, 24]
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 5
        with:
          node-version: ${{ matrix.node }}
      - timeout-minutes: 5
        run: node --test
  python:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [hikae-flash]
        python: ['3.10', '3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        timeout-minutes: 5
      - name: pytest
        timeout-minutes: 5
        env:
          PY_VERSION: ${{ matrix.python }}
        run: uv run --python "$PY_VERSION" --with pytest pytest -q
  bash:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [hikae-flash]
    defaults:
      run:
        working-directory: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: bash --version
        timeout-minutes: 1
        run: bash --version
      - name: test
        timeout-minutes: 5
        run: bash test/test.sh
  powershell:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: hikae-flash, shell: pwsh }
    defaults:
      run:
        working-directory: powershell
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Install PowerShell (hikae-flash)
        if: matrix.os == 'hikae-flash'
        timeout-minutes: 10
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64)
              arch=x64
              digest=6f6015203c47806c5cc444c19d8ed019695e610fbd948154264bf9ca8e157561 ;;
            aarch64|arm64)
              arch=arm64
              digest=c0159b03e85f44ae1e7697818a011558da6c813d0aae848bf5ac13bf435d8624 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          work="$(mktemp -d)"
          # Digests are from the official v7.4.6 hashes.sha256 release asset.
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/powershell-7.4.6-linux-${arch}.tar.gz" \
            -o "$work/powershell.tar.gz"
          printf '%s  %s\n' "$digest" "$work/powershell.tar.gz" | sha256sum --check --strict -
          tar -xzf "$work/powershell.tar.gz" -C "$work"
          chmod +x "$work/pwsh"
          echo "$work" >> "$GITHUB_PATH"
          "$work/pwsh" -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: shell version
        timeout-minutes: 1
        run: $PSVersionTable | Format-List
      - name: test
        timeout-minutes: 5
        run: ${{ matrix.shell }} -NoProfile -File test/test.ps1
  conformance:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: hikae-flash, impl: bash }
          - { os: hikae-flash, impl: node }
          - { os: hikae-flash, impl: python }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.impl == 'node'
        timeout-minutes: 5
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        timeout-minutes: 5
        with:
          python-version: '3.12'
      - name: test conformance runner
        timeout-minutes: 2
        run: python3 -m unittest discover -s conformance -p 'test_*.py' -v
        shell: bash
      - name: run conformance
        timeout-minutes: 5
        env:
          IMPL: ${{ matrix.impl }}
        run: |
          if [ "$IMPL" = "python" ]; then
            export PYTHONPATH="$PWD/python/src"
          fi
          python3 conformance/run.py --impl "$IMPL"
        shell: bash
