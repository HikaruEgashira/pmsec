name: pmsec ci
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'node/**'
      - 'python/**'
      - 'bash/**'
      - 'powershell/**'
      - 'conformance/**'
      - '.github/workflows/pmsec-ci.yml'
  pull_request:
    paths:
      - 'node/**'
      - 'python/**'
      - 'bash/**'
      - 'powershell/**'
      - 'conformance/**'
      - '.github/workflows/pmsec-ci.yml'
permissions: {}
jobs:
  node:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [hikae-flash, macos-latest, windows-latest]
        node: [22, 24]
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 5
        with:
          node-version: ${{ matrix.node }}
      - timeout-minutes: 5
        run: node --test
  python:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [hikae-flash, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        timeout-minutes: 5
      - name: pytest
        timeout-minutes: 5
        env:
          PY_VERSION: ${{ matrix.python }}
        run: uv run --python "$PY_VERSION" --with pytest pytest -q
  bash:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [hikae-flash, macos-latest]
    defaults:
      run:
        working-directory: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: bash --version
        timeout-minutes: 1
        run: bash --version
      - name: test
        timeout-minutes: 5
        run: bash test/test.sh
  powershell:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, shell: pwsh }
          - { os: windows-latest, shell: powershell }
          - { os: hikae-flash,  shell: pwsh }
          - { os: macos-latest,   shell: pwsh }
    defaults:
      run:
        working-directory: powershell
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      # The flash fleet image (Ubuntu arm64) ships no pwsh. Prepare the pinned
      # PowerShell release from its official distribution and verify integrity
      # before extracting or executing it.
      - name: Install PowerShell (hikae-flash)
        if: matrix.os == 'hikae-flash'
        timeout-minutes: 10
        shell: bash
        working-directory: .
        env:
          PWSH_VERSION: '7.4.6'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) arch=x64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          asset="powershell-${PWSH_VERSION}-linux-${arch}.tar.gz"
          work="$(mktemp -d)"
          # Primary: the immutable official release asset for the pinned version.
          asset_url=""
          asset_digest=""
          if curl -fsSL --proto '=https' --tlsv1.2 \
               "https://api.github.com/repos/PowerShell/PowerShell/releases/tags/v${PWSH_VERSION}" \
               -o "$work/release.json" 2>/dev/null; then
            asset_url="$(jq -r --arg a "$asset" '.assets[] | select(.name == $a) | .browser_download_url' "$work/release.json" 2>/dev/null || true)"
            asset_digest="$(jq -r --arg a "$asset" '.assets[] | select(.name == $a) | .digest' "$work/release.json" 2>/dev/null || true)"
          fi
          if [ -n "$asset_url" ] && [ "$asset_url" != "null" ] \
             && [ -n "$asset_digest" ] && [ "$asset_digest" != "null" ]; then
            curl -fsSL --proto '=https' --tlsv1.2 "$asset_url" -o "$work/$asset"
            # Integrity: verify the SHA-256 digest GitHub publishes for the asset.
            printf '%s  %s\n' "${asset_digest#sha256:}" "$work/$asset" | sha256sum --check --strict -
            mkdir -p "$work/pwsh"
            tar -xzf "$work/$asset" -C "$work/pwsh"
            chmod +x "$work/pwsh/pwsh"
            export PATH="$work/pwsh:$PATH"
            echo "$work/pwsh" >> "$GITHUB_PATH"
          else
            # Fallback: Microsoft's GPG-signed Ubuntu repository. apt verifies the
            # signed metadata and package digest before installation.
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo"; fi
            . /etc/os-release
            curl -fsSL --proto '=https' --tlsv1.2 \
              "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb" \
              -o "$work/packages-microsoft-prod.deb"
            $SUDO dpkg -i "$work/packages-microsoft-prod.deb"
            $SUDO apt-get update
            candidate="$(apt-cache madison powershell | awk -v v="$PWSH_VERSION" '$3 ~ ("^" v "([-.]|$)") { print $3; exit }')"
            if [ -z "$candidate" ]; then
              candidate="$(apt-cache madison powershell | awk -v v="${PWSH_VERSION%.*}" '$3 ~ ("^" v "([-.]|$)") { print $3; exit }')"
            fi
            if [ -z "$candidate" ]; then
              echo "PowerShell $PWSH_VERSION is not available from the Microsoft repository" >&2
              exit 1
            fi
            $SUDO apt-get install -y --no-install-recommends "powershell=$candidate"
          fi
          command -v pwsh
          pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: shell version
        timeout-minutes: 1
        run: $PSVersionTable | Format-List
      - name: test
        timeout-minutes: 5
        run: ${{ matrix.shell }} -NoProfile -File test/test.ps1
  conformance:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: hikae-flash, impl: bash }
          - { os: macos-latest,  impl: bash }
          - { os: hikae-flash, impl: node }
          - { os: macos-latest,  impl: node }
          - { os: hikae-flash, impl: python }
          - { os: macos-latest,  impl: python }
          - { os: windows-latest, impl: powershell }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.impl == 'node'
        timeout-minutes: 5
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        timeout-minutes: 5
        with:
          python-version: '3.12'
      - name: test conformance runner
        timeout-minutes: 2
        run: python3 -m unittest discover -s conformance -p 'test_*.py' -v
        shell: bash
      - name: run conformance
        timeout-minutes: 5
        env:
          IMPL: ${{ matrix.impl }}
        run: |
          if [ "$IMPL" = "python" ]; then
            export PYTHONPATH="$PWD/python/src"
          fi
          python3 conformance/run.py --impl "$IMPL"
        shell: bash
