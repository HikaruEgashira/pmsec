name: pmsec release npm
# The release workflow dispatches its GITHUB_TOKEN-created tag; new tag pushes
# also publish directly. Both paths build the package from the event's commit.
on:
  push:
    tags:
      - 'pmsec-node-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag version to publish (e.g. 2026.10.4)'
        required: true
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  publish:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Validate tag, package version and event
        id: release
        timeout-minutes: 1
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before || '' }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          node ../scripts/validate-npm-publish-version.mjs "$npm_version"
          actual="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version)')"
          bash ../scripts/validate-release-tag.sh pmsec-node-v "$actual"
      - name: Test
        timeout-minutes: 5
        run: node --test
      - name: Pack tarball
        timeout-minutes: 5
        run: npm pack
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        timeout-minutes: 5
        with:
          subject-path: 'node/*.tgz'
      - name: Publish
        timeout-minutes: 5
        run: npm publish ./*.tgz --provenance --access public
