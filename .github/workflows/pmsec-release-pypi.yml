name: pmsec release pypi
# The release workflow dispatches its GITHUB_TOKEN-created tag; new tag pushes
# also publish directly. Both paths build the package from the event's commit.
on:
  push:
    tags:
      - 'pmsec-py-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag version to publish (e.g. 2026.10.4)'
        required: true
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  publish:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/pmsec/
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.0.0
        timeout-minutes: 5
        with:
          python-version: '3.12'
      - name: Validate tag, project version and event
        id: release
        timeout-minutes: 1
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before || '' }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          actual="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          bash ../scripts/validate-release-tag.sh pmsec-py-v "$actual"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        timeout-minutes: 5
      - name: Test
        timeout-minutes: 5
        run: uv run --with pytest pytest -q
      - name: Build
        timeout-minutes: 5
        run: uv build
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        timeout-minutes: 5
        with:
          subject-path: 'python/dist/*'
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        timeout-minutes: 5
        with:
          packages-dir: python/dist
